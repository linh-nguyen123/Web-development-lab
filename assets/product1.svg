<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Dark Studio Background from Figma -->
  <rect width="300" height="220" fill="#090d16"/>
  <defs>
    <radialGradient id="mouseLight" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <!-- Cast shadow -->
  <ellipse cx="150" cy="170" rx="75" ry="14" fill="#000000" opacity="0.6"/>
  <!-- Ergonomic Wireless Mouse Body -->
  <path d="M150 50 C110 50, 95 85, 95 130 C95 165, 115 180, 150 180 C185 180, 205 165, 205 130 C205 85, 190 50, 150 50 Z" fill="url(#mouseLight)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Center Split Line & Scroll Wheel -->
  <line x1="150" y1="52" x2="150" y2="105" stroke="#020617" stroke-width="2"/>
  <rect x="146" y="70" width="8" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <!-- Side thumb rest contour -->
  <path d="M96 115 C92 130, 94 145, 98 155" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
</svg>
