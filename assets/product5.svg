<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Clean studio desk background from Figma -->
  <rect width="300" height="220" fill="#f8fafc"/>
  <!-- Cast shadow -->
  <ellipse cx="150" cy="190" rx="90" ry="10" fill="#cbd5e1" opacity="0.6"/>
  <!-- Monitor base & neck -->
  <rect x="144" y="145" width="12" height="40" fill="#94a3b8"/>
  <rect x="115" y="180" width="70" height="8" rx="4" fill="#64748b"/>
  <!-- Monitor frame -->
  <rect x="45" y="40" width="210" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- IPS screen wallpaper (minimalist landscape gradient) -->
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="49" y="44" width="202" height="112" rx="3" fill="url(#screenGrad)"/>
  <path d="M49 130 Q 110 90 150 115 T 251 100 L 251 156 L 49 156 Z" fill="#0f172a" opacity="0.45"/>
</svg>
