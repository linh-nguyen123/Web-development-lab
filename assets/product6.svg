<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Dark Studio Background from Figma -->
  <rect width="300" height="220" fill="#0b1120"/>
  <!-- Boom Arm Stand -->
  <path d="M220 200 L180 120 L130 90" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="180" cy="120" r="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <circle cx="130" cy="90" r="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Shock mount ring -->
  <circle cx="115" cy="85" r="28" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- Studio Cardioid Capsule -->
  <rect x="100" y="60" width="30" height="60" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <!-- Metal mesh pattern -->
  <rect x="102" y="62" width="26" height="28" rx="13" fill="#0f172a"/>
  <line x1="104" y1="70" x2="126" y2="70" stroke="#475569" stroke-width="1"/>
  <line x1="104" y1="76" x2="126" y2="76" stroke="#475569" stroke-width="1"/>
  <line x1="104" y1="82" x2="126" y2="82" stroke="#475569" stroke-width="1"/>
  <!-- Glowing gain ring / mute indicator -->
  <circle cx="115" cy="100" r="4" fill="#38bdf8"/>
</svg>
