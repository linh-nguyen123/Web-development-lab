<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Light surface background from Figma -->
  <rect width="300" height="220" fill="#f8fafc"/>
  <!-- Cast shadow -->
  <ellipse cx="150" cy="115" rx="45" ry="75" fill="#e2e8f0" opacity="0.8"/>
  <!-- Watch silicone band top & bottom -->
  <path d="M128 20 L128 85 L172 85 L172 20 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M128 135 L128 200 L172 200 L172 135 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Watch circular dial chassis -->
  <circle cx="150" cy="110" r="42" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="150" cy="110" r="38" fill="#0f172a"/>
  <!-- Display elements on screen -->
  <text x="150" y="106" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">10:42</text>
  <text x="150" y="122" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#38bdf8" text-anchor="middle">7,842 STEPS</text>
  <!-- Activity arc -->
  <circle cx="150" cy="110" r="32" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="150" cy="110" r="32" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="200" stroke-dashoffset="60" stroke-linecap="round"/>
  <!-- Digital crown button -->
  <rect x="192" y="102" width="4" height="14" rx="2" fill="#64748b"/>
</svg>
