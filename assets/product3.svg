<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Vibrant Yellow Studio Background from Figma -->
  <rect width="300" height="220" fill="#facc15"/>
  <!-- Headphones Headband -->
  <path d="M70 120 C70 50, 230 50, 230 120" fill="none" stroke="#18181b" stroke-width="16" stroke-linecap="round"/>
  <path d="M85 110 C85 62, 215 62, 215 110" fill="none" stroke="#27272a" stroke-width="8" stroke-linecap="round"/>
  <!-- Left Ear Cup -->
  <g transform="translate(62, 105)">
    <rect x="-12" y="0" width="24" height="65" rx="12" fill="#09090b"/>
    <ellipse cx="0" cy="32" rx="8" ry="24" fill="#27272a"/>
    <circle cx="0" cy="32" r="5" fill="#3f3f46"/>
  </g>
  <!-- Right Ear Cup -->
  <g transform="translate(238, 105)">
    <rect x="-12" y="0" width="24" height="65" rx="12" fill="#09090b"/>
    <ellipse cx="0" cy="32" rx="8" ry="24" fill="#27272a"/>
    <circle cx="0" cy="32" r="5" fill="#3f3f46"/>
  </g>
  <!-- Cast Shadow -->
  <ellipse cx="150" cy="185" rx="75" ry="12" fill="#ca8a04" opacity="0.4"/>
</svg>
