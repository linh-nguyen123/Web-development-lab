<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Light surface background from Figma -->
  <rect width="300" height="220" fill="#f8fafc"/>
  <!-- Cast shadow -->
  <ellipse cx="120" cy="195" rx="50" ry="8" fill="#e2e8f0"/>
  <!-- Heavy Circular Base -->
  <ellipse cx="120" cy="190" rx="35" ry="8" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <!-- Articulated Angled Arm -->
  <path d="M120 188 L145 105 L200 70" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <circle cx="145" cy="105" r="6" fill="#1e293b"/>
  <!-- Lamp Shade / Head -->
  <path d="M190 60 L235 75 L225 90 L180 75 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Warm / RGB Glow Cone -->
  <polygon points="185,80 230,95 270,180 130,180" fill="#fef08a" opacity="0.3"/>
</svg>
