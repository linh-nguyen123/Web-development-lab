    <rect x="40" y="122" width="26" height="16" rx="2"/>
    <rect x="70" y="122" width="16" height="16" rx="2"/>
    <rect x="90" y="122" width="16" height="16" rx="2"/>
    <rect x="110" y="122" width="80" height="16" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="194" y="122" width="16" height="16" rx="2"/>
    <rect x="214" y="122" width="16" height="16" rx="2"/>
