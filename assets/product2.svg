  <!-- Keycaps grid -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1">
    <!-- Row 1: Function row -->
    <rect x="40" y="70" width="14" height="12" rx="2"/>
    <rect x="58" y="70" width="14" height="12" rx="2"/>
    <rect x="76" y="70" width="14" height="12" rx="2"/>
    <rect x="94" y="70" width="14" height="12" rx="2"/>
    <rect x="112" y="70" width="14" height="12" rx="2"/>
    <rect x="130" y="70" width="14" height="12" rx="2"/>
    <rect x="148" y="70" width="14" height="12" rx="2"/>
    <rect x="166" y="70" width="14" height="12" rx="2"/>
    <rect x="184" y="70" width="14" height="12" rx="2"/>
    <rect x="202" y="70" width="14" height="12" rx="2"/>
    <rect x="220" y="70" width="14" height="12" rx="2"/>
    <rect x="238" y="70" width="22" height="12" rx="2" fill="#e2e8f0"/>
    <!-- Row 2 -->
    <rect x="40" y="86" width="18" height="14" rx="2"/>
    <rect x="62" y="86" width="14" height="14" rx="2"/>
    <rect x="80" y="86" width="14" height="14" rx="2"/>
    <rect x="98" y="86" width="14" height="14" rx="2"/>
    <rect x="116" y="86" width="14" height="14" rx="2"/>
    <rect x="134" y="86" width="14" height="14" rx="2"/>
    <rect x="152" y="86" width="14" height="14" rx="2"/>
    <rect x="170" y="86" width="14" height="14" rx="2"/>
    <rect x="188" y="86" width="14" height="14" rx="2"/>
    <rect x="206" y="86" width="14" height="14" rx="2"/>
    <rect x="224" y="86" width="14" height="14" rx="2"/>
    <rect x="242" y="86" width="18" height="14" rx="2"/>
    <!-- Row 3 -->
    <rect x="40" y="104" width="22" height="14" rx="2"/>
    <rect x="66" y="104" width="14" height="14" rx="2"/>
    <rect x="84" y="104" width="14" height="14" rx="2"/>
    <rect x="102" y="104" width="14" height="14" rx="2"/>
    <rect x="120" y="104" width="14" height="14" rx="2"/>
    <rect x="138" y="104" width="14" height="14" rx="2"/>
    <rect x="156" y="104" width="14" height="14" rx="2"/>
    <rect x="174" y="104" width="14" height="14" rx="2"/>
    <rect x="192" y="104" width="14" height="14" rx="2"/>
    <rect x="210" y="104" width="14" height="14" rx="2"/>
    <rect x="228" y="104" width="32" height="14" rx="2" fill="#e2e8f0"/>
