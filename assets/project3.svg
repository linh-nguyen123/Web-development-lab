<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg3)"/>
  <!-- Shopping Bag / Store Showcase -->
  <rect x="50" y="40" width="300" height="180" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="70" y="60" width="110" height="140" rx="8" fill="#27272a"/>
  <!-- Bag Icon -->
  <path d="M110 90 C110 80 140 80 140 90 V100 H110 Z" fill="none" stroke="#f97316" stroke-width="2"/>
  <rect x="98" y="100" width="54" height="60" rx="4" fill="url(#orangeGrad)"/>
  <!-- Price tag & rating -->
  <rect x="98" y="170" width="35" height="12" rx="3" fill="#3f3f46"/>
  <rect x="140" y="170" width="12" height="12" rx="3" fill="#10b981"/>
  <!-- Product list right -->
  <rect x="200" y="65" width="130" height="38" rx="6" fill="#27272a"/>
  <rect x="210" y="75" width="60" height="8" rx="2" fill="#e4e4e7"/>
  <rect x="210" y="88" width="40" height="6" rx="2" fill="#71717a"/>
  <rect x="200" y="112" width="130" height="38" rx="6" fill="#27272a"/>
  <rect x="210" y="122" width="70" height="8" rx="2" fill="#e4e4e7"/>
  <rect x="210" y="135" width="45" height="6" rx="2" fill="#71717a"/>
  <rect x="200" y="160" width="130" height="40" rx="6" fill="url(#orangeGrad)"/>
  <text x="265" y="185" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Checkout</text>
</svg>
