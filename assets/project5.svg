<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg5)"/>
  <rect x="40" y="30" width="320" height="200" rx="10" fill="#062d24" stroke="#047857" stroke-width="1.5"/>
  <!-- Candle bars -->
  <!-- Bar 1 -->
  <line x1="85" y1="90" x2="85" y2="175" stroke="#34d399" stroke-width="1.5"/>
  <rect x="75" y="110" width="20" height="45" rx="2" fill="url(#emeraldGrad)"/>
  <!-- Bar 2 -->
  <line x1="130" y1="80" x2="130" y2="160" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="120" y="100" width="20" height="40" rx="2" fill="#e11d48"/>
  <!-- Bar 3 -->
  <line x1="175" y1="70" x2="175" y2="180" stroke="#34d399" stroke-width="1.5"/>
  <rect x="165" y="90" width="20" height="60" rx="2" fill="url(#emeraldGrad)"/>
  <!-- Bar 4 -->
  <line x1="220" y1="60" x2="220" y2="150" stroke="#34d399" stroke-width="1.5"/>
  <rect x="210" y="75" width="20" height="50" rx="2" fill="url(#emeraldGrad)"/>
  <!-- Bar 5 -->
  <line x1="265" y1="50" x2="265" y2="160" stroke="#34d399" stroke-width="1.5"/>
  <rect x="255" y="60" width="20" height="75" rx="2" fill="url(#emeraldGrad)"/>
  <!-- Bar 6 -->
  <line x1="310" y1="40" x2="310" y2="140" stroke="#34d399" stroke-width="1.5"/>
  <rect x="300" y="50" width="20" height="65" rx="2" fill="url(#emeraldGrad)"/>
  <!-- Balance header -->
  <rect x="55" y="45" width="120" height="22" rx="4" fill="#022c22"/>
  <text x="65" y="60" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold">+28.4% ARR</text>
</svg>
