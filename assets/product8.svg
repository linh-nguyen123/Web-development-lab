<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Clean studio desk background from Figma -->
  <rect width="300" height="220" fill="#f8fafc"/>
  <!-- Cast shadow -->
  <polygon points="70,185 230,185 250,200 50,200" fill="#e2e8f0"/>
  <!-- Aluminum Riser Base Plate -->
  <polygon points="80,180 220,180 210,172 90,172" fill="#94a3b8"/>
  <!-- Angled Arms -->
  <polygon points="90,172 105,95 120,95 105,172" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <polygon points="210,172 195,95 180,95 195,172" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Angled Platform Tray -->
  <polygon points="70,105 230,105 245,80 55,80" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Anti-slip silicone pads -->
  <rect x="75" y="85" width="25" height="15" rx="3" fill="#64748b"/>
  <rect x="200" y="85" width="25" height="15" rx="3" fill="#64748b"/>
  <!-- Laptop Front Lip Hooks -->
  <rect x="68" y="103" width="16" height="8" rx="2" fill="#64748b"/>
  <rect x="216" y="103" width="16" height="8" rx="2" fill="#64748b"/>
</svg>
