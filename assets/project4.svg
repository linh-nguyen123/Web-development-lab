<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg4)"/>
  <!-- Chat feed & social network -->
  <rect x="50" y="35" width="300" height="190" rx="10" fill="#0b1e22" stroke="#134e4a" stroke-width="1.5"/>
  <!-- User 1 -->
  <circle cx="85" cy="70" r="15" fill="url(#tealGrad)"/>
  <rect x="110" y="60" width="180" height="26" rx="8" fill="#134e4a"/>
  <rect x="120" y="70" width="120" height="6" rx="3" fill="#ccfbf1"/>
  <!-- User 2 response -->
  <circle cx="315" cy="115" r="15" fill="#38bdf8"/>
  <rect x="140" y="105" width="160" height="26" rx="8" fill="#0284c7"/>
  <rect x="150" y="115" width="110" height="6" rx="3" fill="#ffffff"/>
  <!-- User 3 -->
  <circle cx="85" cy="160" r="15" fill="#f43f5e"/>
  <rect x="110" y="150" width="150" height="26" rx="8" fill="#134e4a"/>
  <rect x="120" y="160" width="100" height="6" rx="3" fill="#ccfbf1"/>
  <!-- Live feed indicator -->
  <circle cx="75" cy="205" r="5" fill="#10b981"/>
  <rect x="90" y="202" width="80" height="6" rx="3" fill="#5eead4"/>
</svg>
