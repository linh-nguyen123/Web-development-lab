<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31102b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg6)"/>
  <rect x="40" y="30" width="320" height="200" rx="10" fill="#1e1022" stroke="#4c1d47" stroke-width="1.5"/>
  <!-- Activity Rings -->
  <circle cx="120" cy="130" r="50" fill="none" stroke="#4c1d47" stroke-width="10"/>
  <circle cx="120" cy="130" r="50" fill="none" stroke="#f43f5e" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="65" stroke-linecap="round"/>
  
  <circle cx="120" cy="130" r="35" fill="none" stroke="#4c1d47" stroke-width="10"/>
  <circle cx="120" cy="130" r="35" fill="none" stroke="#10b981" stroke-width="10" stroke-dasharray="220" stroke-dashoffset="50" stroke-linecap="round"/>
  
  <circle cx="120" cy="130" r="20" fill="none" stroke="#4c1d47" stroke-width="8"/>
  <circle cx="120" cy="130" r="20" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="125" stroke-dashoffset="25" stroke-linecap="round"/>
  <!-- Metric stats right -->
  <rect x="200" y="65" width="135" height="40" rx="6" fill="#2d1330"/>
  <text x="210" y="85" fill="#fda4af" font-family="sans-serif" font-size="11">MOVE</text>
  <text x="210" y="100" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">640 / 700 kcal</text>

  <rect x="200" y="115" width="135" height="40" rx="6" fill="#2d1330"/>
  <text x="210" y="135" fill="#a7f3d0" font-family="sans-serif" font-size="11">EXERCISE</text>
  <text x="210" y="150" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">42 / 30 mins</text>

  <rect x="200" y="165" width="135" height="40" rx="6" fill="#2d1330"/>
  <text x="210" y="185" fill="#bae6fd" font-family="sans-serif" font-size="11">STAND</text>
  <text x="210" y="200" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">11 / 12 hrs</text>
</svg>
